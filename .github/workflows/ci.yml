name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needed:" && echo "${unformatted}"
            exit 1
          fi

      - run: go vet ./...

      # The race detector matters here: `up` writes several repos while
      # holding a lock, and the TUI runs its work on a second goroutine.
      - run: go test -race ./...
