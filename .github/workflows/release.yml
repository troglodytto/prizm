# Builds a binary for every supported platform and attaches it to the GitHub
# release for the tag that triggered the run.
#
# Storage is SQLite through cgo, so nothing here can be cross-compiled from a
# single runner: each OS builds on its own. Linux links statically against
# musl so one binary runs on any distro — a glibc-linked build carries the
# glibc floor of whatever runner produced it, which silently excludes anyone
# on an older LTS.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,  goarch: amd64, runner: ubuntu-latest}
          - {goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: arm64, runner: macos-14}
          # Cross-built on the arm64 runner rather than asking for an Intel
          # one. GitHub retired macos-13 and the surviving Intel labels keep
          # moving; Xcode's clang targets x86_64 from Apple silicon, so this
          # depends on nothing but the toolchain already installed.
          - {goos: darwin, goarch: amd64, runner: macos-14, cc: "clang -arch x86_64"}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install musl toolchain
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"

          # osusergo and netgo keep os/user and DNS in pure Go;
          # sqlite_omit_load_extension drops the dlopen SQLite would otherwise
          # need. Without all three a static link warns that it still wants
          # shared libc at runtime, which defeats the point.
          tags="osusergo,netgo,sqlite_omit_load_extension"
          ldflags="-s -w -X github.com/troglodytto/prizm/internal/cli.version=${version}"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            export CC=musl-gcc
            ldflags="${ldflags} -linkmode external -extldflags -static"
          elif [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi

          go build -trimpath -tags "${tags}" -ldflags "${ldflags}" -o prizm .

          # A cross-build that silently produced the host architecture would
          # ship a binary that cannot start on the machine it is named for.
          file prizm
          case "${{ matrix.goarch }}" in
            amd64) file prizm | grep -q "x86_64" || exit 1 ;;
            arm64) file prizm | grep -qE "arm64|aarch64" || exit 1 ;;
          esac

      - name: Verify the binary runs
        # Only where the runner can execute what it just built. A release that
        # ships a binary nobody started is worse than a failed build.
        if: (matrix.goos == 'linux' && matrix.goarch == 'amd64') || matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          ./prizm --version
          ./prizm init smoke
          ./prizm ls | grep smoke
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/prizm-smoke

      - name: Package
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="prizm_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          cp prizm LICENSE README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: prizm_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Job-level, because a step's own `env` is not visible to its `if`.
    # Releases stay unsigned rather than failing if the secret is absent.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The release notes come from the tag's own annotation, which a
          # shallow checkout does not fetch — without this the body is empty.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz | tee checksums.txt

      # Only checksums.txt is signed. Every archive's hash is in it, so one
      # signature covers the whole release: tamper with any tarball and its
      # hash stops matching; tamper with the list and the signature breaks.
      - name: Sign checksums
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import

          args="--batch --yes --pinentry-mode loopback --armor --detach-sign"
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%s' "$GPG_PASSPHRASE" |
              gpg $args --passphrase-fd 0 \
                --output dist/checksums.txt.asc dist/checksums.txt
          else
            gpg $args --output dist/checksums.txt.asc dist/checksums.txt
          fi

          # Never publish a signature that does not verify.
          gpg --verify dist/checksums.txt.asc dist/checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"

          # The tag is annotated and carries the release notes; reuse them
          # rather than writing a second description that can disagree.
          notes="$(git tag -l --format='%(contents)' "${version}")"

          gh release create "${version}" dist/* \
            --title "${version}" \
            --notes "${notes:-Release ${version}}" \
            --verify-tag
